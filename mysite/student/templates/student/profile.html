{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile | Student Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-container {
            width: 90%;
            max-width: 600px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #0052cc;
            margin-bottom: 25px;
        }

        .profile-image {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0077ff;
            margin-bottom: 20px;
        }

        form {
            margin-top: 20px;
        }

        input[type="file"] {
            margin-top: 10px;
            padding: 10px;
        }

        input[type="submit"] {
            background: linear-gradient(135deg, #0077ff, #00c6ff);
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            margin-top: 20px;
        }

        input[type="submit"]:hover {
            background: linear-gradient(135deg, #0060cc, #00aaff);
        }

        .info {
            text-align: left;
            margin-top: 25px;
            line-height: 1.8;
        }

        .info p {
            margin: 8px 0;
        }

        .btn-back {
            display: inline-block;
            background: #ff6a3d;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 20px;
        }

        .btn-back:hover {
            background: #e65b2e;
        }

    </style>
</head>
<body>

<div class="profile-container">
    <h1>👤 My Profile</h1>

{% if profile.profile_image %}
    <img src="{{ profile.profile_image.url }}" alt="Profile Picture" class="profile-image">
{% else %}
    <img src="{% static 'student/default_profile.png' %}" alt="Default Profile" class="profile-image">
{% endif %}

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <label for="profile_image">Change Profile Picture:</label><br>
    <input type="file" name="profile_image" accept="image/*"><br>
    <input type="submit" value="Update Picture">
</form>


    <div class="info">
       <p><strong>First Name:</strong> {{ user.first_name }}</p>
<p><strong>Last Name:</strong> {{ user.last_name }}</p>

<p><strong>Email:</strong> {{ user.email }}</p>
    </div>

    <a href="{% url 'student:dashboard' %}" class="btn-back">⬅ Back to Dashboard</a>
</div>

</body>
</html>
