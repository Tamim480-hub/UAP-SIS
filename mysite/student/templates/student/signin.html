{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UAP Student Information System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* ---------- Global Reset ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #b3d9ff, #e6f2ff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            flex-direction: column;
        }

        /* ---------- Container ---------- */
        .container {
            width: 450px;
            background: rgba(255, 255, 255, 0.95);
            padding: 55px 40px;
            border-radius: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 70, 0.2);
            text-align: center;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Logo ---------- */
        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        /* ---------- Heading ---------- */
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #002b80;
            margin-bottom: 25px;
        }

        /* ---------- Input Fields ---------- */
        input {
            width: 100%;
            padding: 14px 15px;
            margin: 10px 0;
            border-radius: 12px;
            border: 2px solid #0077ff;
            background: #f8faff;
            font-size: 15px;
            transition: 0.3s ease;
        }

        input:focus {
            border-color: #0047b3;
            outline: none;
            box-shadow: 0 0 8px rgba(0, 71, 179, 0.3);
        }

        /* ---------- Button ---------- */
        button {
            width: 100%;
            padding: 14px;
            margin-top: 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0047b3, #001f5c);
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #002b80, #001847);
        }

        /* ---------- Message ---------- */
        .message {
            margin-top: 15px;
            color: #d32f2f;
            font-weight: 500;
            min-height: 22px;
            font-size: 15px;
        }

        /* ---------- Links ---------- */
        .links {
            margin-top: 25px;
        }

        a {
            display: block;
            font-size: 15px;
            color: #0047b3;
            text-decoration: none;
            margin-top: 8px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        a:hover {
            color: #001f5c;
            text-decoration: underline;
        }

        /* ---------- Footer ---------- */
        footer {
            text-align: center;
            margin-top: 45px;
            font-size: 14px;
            color: #002b80;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="{% static 'image/ইউনিভার্সিটি_অব_এশিয়া_প্যাসিফিক_এর_লোগো.png' %}" alt="UAP Logo" class="logo">

        <h1>UAP Student Information System</h1>

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        {% if messages %}
        <div class="message">
            {% for message in messages %}
                {{ message }}
            {% endfor %}
        </div>
        {% endif %}

        <div class="links">
            <a href="{% url 'student:signup' %}">Don’t have an account? Sign Up</a>
            <a href="#">Forgot Password?</a>
        </div>

        <footer>
            © 2025 University of Asia Pacific | Student Portal
        </footer>
    </div>
</body>
</html>
