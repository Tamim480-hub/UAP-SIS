{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f7fa; font-family: 'Arial', sans-serif; }
        .container { max-width: 600px; margin-top: 50px; }
    </style>
</head>
<body>
<div class="container">
    <h1 class="mb-4">Attendance Page</h1>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    {% if success %}
        <div class="alert alert-success">{{ success }}</div>
    {% endif %}

    <form method="POST" class="mb-3">
        {% csrf_token %}
        <div class="mb-3">
            <label for="student_id" class="form-label">Select Student</label>
            <select class="form-select" id="student_id" name="student_id" required>
                <option value="" disabled selected>Select Student</option>
                {% for student in students %}
                    <option value="{{ student.id }}">{{ student.name }} (ID: {{ student.id }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="attendance_1" class="form-label">Status</label>
            <select class="form-select" id="attendance_1" name="attendance_1">
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Submit Attendance</button>
        <a href="{% url 'student:dashboard' %}" class="btn btn-secondary ms-2">Back to Dashboard</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
